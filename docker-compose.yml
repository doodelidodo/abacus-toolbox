services:
  xml-to-xlsx:
    build:
      context: .
      dockerfile: Dockerfile
    image: abacus-toolbox:latest
    container_name: abacus-toolbox
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: "20"
      LOG_LEVEL: "INFO"
      # API_KEY: "bitte-ein-langes-geheimes-token"   # aktivieren -> Header X-API-Key wird Pflicht
      # ENABLED_MODULES: "fsm_xlsx,encoding"         # aktive Werkzeuge; leer = alle
    volumes:
      # Feldkonfiguration live aus dem Repository: Änderungen wirken sofort, ohne Rebuild
      - ./converter/xml_to_xlsx_config.json:/config/xml_to_xlsx_config.json:ro
    restart: unless-stopped
